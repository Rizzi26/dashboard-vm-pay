name: Ingestão VMpay

# Cron no GitHub Actions em vez do Render: o free tier do Render não tem cron
# job, e para repositório público os minutos do Actions não são cobrados.
#
# O agendamento do Actions é *best-effort* — atrasos de 5 a 20 minutos são
# comuns e uma execução pode ser pulada em horário de pico. Isso é aceitável
# aqui só porque a ingestão é por cursor de id e idempotente: atrasar significa
# dado menos fresco, nunca dado perdido ou duplicado. Não troque por uma
# estratégia baseada em "a cada N minutos pegue os últimos N minutos" — essa
# quebraria com o mesmo atraso.
on:
  schedule:
    # De hora em hora: intervalo curto é o que dá resolução à detecção de
    # quebra (queda de saldo × vendas do intervalo) e mantém o dashboard
    # fresco. Custa ~10 req/rodada na VMpay (limite: 300/min) e nada em
    # minutos de Actions (repo público). A foto histórica só grava linha que
    # mudou, então rodada sem movimento não incha o banco.
    # O agendamento do Actions é best-effort: atrasos de 5–20 min são normais e
    # inofensivos aqui — a ingestão é por cursor e idempotente.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Onde ingerir (o cron roda só em produção)"
        type: choice
        options: [producao, homolog]
        default: producao
      recurso:
        description: "Qual recurso ingerir"
        type: choice
        options: [todos, cashless_facts, vends]
        default: todos
      max_rows:
        description: "Teto de linhas (0 = sem teto, para backfill)"
        type: string
        default: "50000"

# Sem gatilho de pull_request: num repositório público, PR de fork não pode
# alcançar os secrets, e não há motivo para ingerir a partir de um PR.

concurrency:
  # Uma rodada por vez POR AMBIENTE. Não cancela a que está correndo: durante
  # um backfill, cancelar a cada 15 min impediria o cursor de progredir.
  group: ingest-${{ inputs.ambiente || 'producao' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Homologação usa secrets de NOME PRÓPRIO (HML_*), escolhidos aqui em
      # bash. Não são environments do GitHub de propósito: num environment, o
      # secret que falta cai em silêncio no de mesmo nome do repositório — o
      # de produção. Aqui, faltou, falha.
      - name: escolher ambiente
        env:
          AMBIENTE: ${{ inputs.ambiente || 'producao' }}
          PRD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRD_VMPAY_INGEST_TOKEN: ${{ secrets.VMPAY_INGEST_TOKEN }}
          PRD_VMPAY_BASE: ${{ secrets.VMPAY_BASE }}
          HML_DATABASE_URL: ${{ secrets.HML_DATABASE_URL }}
          HML_VMPAY_INGEST_TOKEN: ${{ secrets.HML_VMPAY_INGEST_TOKEN }}
          HML_VMPAY_BASE: ${{ secrets.HML_VMPAY_BASE }}
        run: |
          if [ "$AMBIENTE" = "homolog" ]; then
            : "${HML_DATABASE_URL:?defina o secret HML_DATABASE_URL}"
            : "${HML_VMPAY_INGEST_TOKEN:?defina o secret HML_VMPAY_INGEST_TOKEN}"
            # Base vazia = produção da VMpay; em homologação isso nunca é certo.
            : "${HML_VMPAY_BASE:?defina o secret HML_VMPAY_BASE}"
            pre=HML
          else
            : "${PRD_DATABASE_URL:?defina o secret DATABASE_URL}"
            : "${PRD_VMPAY_INGEST_TOKEN:?defina o secret VMPAY_INGEST_TOKEN}"
            pre=PRD
          fi
          for v in DATABASE_URL VMPAY_INGEST_TOKEN VMPAY_BASE; do
            nome="${pre}_${v}"
            # heredoc delimitado: valor nunca passa por echo nem vira log
            { echo "$v<<__FIM__"; printenv "$nome" || true; echo "__FIM__"; } >> "$GITHUB_ENV"
          done
          echo "ambiente: $AMBIENTE"

      - name: instalar
        working-directory: apps/api
        run: |
          uv venv
          uv pip install -e .

      - name: ingerir
        working-directory: apps/api
        # DATABASE_URL, VMPAY_INGEST_TOKEN e VMPAY_BASE vêm do passo
        # "escolher ambiente", via GITHUB_ENV.
        env:
          INGEST_MAX_ROWS: ${{ inputs.max_rows || '50000' }}
          RECURSO: ${{ inputs.recurso || 'todos' }}
        # O log de Actions em repositório público é visível para qualquer um. O
        # GitHub mascara o valor exato dos secrets, mas não uma versão
        # transformada deles — por isso o cliente já faz redaction do
        # access_token em toda URL antes de logar, e nada aqui imprime o
        # ambiente.
        run: |
          if [ "$RECURSO" = "todos" ]; then
            .venv/bin/vmpay-ingest
          else
            .venv/bin/python -c "
          import asyncio, json, os
          from vmpay_api.ingest import sync_all
          print(json.dumps(asyncio.run(sync_all([os.environ['RECURSO']])), ensure_ascii=False, indent=2))
          "
          fi
