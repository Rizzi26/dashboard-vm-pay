name: Migração de banco

# Aplicação manual de migration no Supabase, usando o mesmo secret
# DATABASE_URL da ingestão. Existe porque nenhuma máquina de desenvolvimento
# guarda credencial do banco (repositório público, política da casa) — o
# caminho para DDL em produção é este workflow ou o SQL Editor do painel.
on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: "Nome do arquivo em supabase/migrations (ex.: 0004_stock_history.sql)"
        type: string
        required: true
      ambiente:
        description: "Banco de destino"
        type: choice
        options: [producao, homolog]
        default: producao

concurrency:
  # Mesmo grupo da ingestão: DDL não roda por cima de uma rodada de ingest —
  # espera a vez em vez de disputar lock com upsert no meio.
  group: ingest-${{ inputs.ambiente }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: validar caminho e sintaxe
        env:
          ARQUIVO: ${{ inputs.arquivo }}
        run: |
          # basename barra path traversal: o input vira só um nome de arquivo.
          nome="$(basename "$ARQUIVO")"
          caminho="supabase/migrations/$nome"
          [ -f "$caminho" ] || { echo "não existe: $caminho"; exit 1; }
          echo "caminho=$caminho" >> "$GITHUB_ENV"
          pip install --quiet pglast
          python -c "import pglast, sys; pglast.parse_sql(open(sys.argv[1]).read()); print('sintaxe OK')" "$caminho"

      - name: aplicar
        env:
          AMBIENTE: ${{ inputs.ambiente }}
          PRD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HML_DATABASE_URL: ${{ secrets.HML_DATABASE_URL }}
        # -1 = transação única: ou a migration inteira entra, ou nada entra.
        # O log é público (repo público); psql só imprime os comandos do
        # arquivo, nunca a URL de conexão.
        # Secret de homologação com nome próprio: se faltar, falha — nunca cai
        # no banco de produção (ver ingest.yml).
        run: |
          if [ "$AMBIENTE" = "homolog" ]; then
            DATABASE_URL="${HML_DATABASE_URL:?defina o secret HML_DATABASE_URL}"
          else
            DATABASE_URL="${PRD_DATABASE_URL:?defina o secret DATABASE_URL}"
          fi
          echo "ambiente: $AMBIENTE"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f "$caminho"
