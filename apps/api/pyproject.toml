[project]
name = "vmpay-api"
version = "0.1.0"
description = "Ingestão e agregação da API VMpay (FastAPI, roda no Render)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "vmpay",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "httpx>=0.27"]

[project.scripts]
vmpay-ingest = "vmpay_api.ingest:cli"

[tool.uv.sources]
vmpay = { path = "../../packages/vmpay", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vmpay_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
